name: dinar-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dinar}
      POSTGRES_USER: ${POSTGRES_USER:-dinar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - dinar-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
      exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - dinar-prod-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - dinar-prod-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/app-policy.json:/config/app-policy.json:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/dinar-public
        mc mb --ignore-existing local/dinar-private
        mc anonymous set download local/dinar-public
        mc admin policy create local dinar-app-policy /config/app-policy.json || true
        mc admin user add local "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" || true
        mc admin policy attach local dinar-app-policy --user "$${MINIO_ACCESS_KEY}"

  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/api.Dockerfile
      args:
        VERSION: ${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - ${SHARED_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      API_ADDR: :8080
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    secrets:
      - jwt_private_key
      - jwt_public_key

  worker:
    build:
      context: ./apps/api
      dockerfile: ../../docker/api.Dockerfile
      args:
        VERSION: ${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - ${SHARED_ENV_FILE:-.env}
    environment:
      APP_ENV: production
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
    depends_on:
      api:
        condition: service_started
    secrets:
      - jwt_private_key
      - jwt_public_key
    command: ["/app/dinar-api", "worker"]

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:?NEXT_PUBLIC_MEDIA_BASE_URL is required}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
      NOTIFICATIONS_WS_PATH: ${NOTIFICATIONS_WS_PATH:-/api/v1/ws/notifications}
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - dinar-prod-caddy-data:/data
      - dinar-prod-caddy-config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

volumes:
  dinar-prod-postgres:
  dinar-prod-redis:
  dinar-prod-minio:
  dinar-prod-caddy-data:
  dinar-prod-caddy-config:

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
